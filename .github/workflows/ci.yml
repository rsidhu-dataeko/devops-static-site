name: DevOps Site CI/CD
on: 
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Test Kubernetes access
        run:  |
          kubectl config current-context
          kubectl get nodes
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: docker build -t devops-static-site:test .
      - name: Tag Docker image
        run: docker tag devops-static-site:test ghcr.io/rsidhu-dataeko/devops-static-site:${{ github.sha }}
      - name: Push Docker image
        run: docker push ghcr.io/rsidhu-dataeko/devops-static-site:${{ github.sha }}
      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/devops-site \
            devops-static-site=ghcr.io/rsidhu-dataeko/devops-static-site:${{ github.sha }} \
            -n devops-site
      - name: Verify Kubernetes rollout
        run: |
          kubectl rollout status deployment/devops-site -n devops-site --timeout=5m
